# Python Script Manager — one-command Debian 12 deploy
#
# Usage:
#   cp deploy/.env.example .env      # then edit ADMIN_PASSWORD / JWT_SECRET
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#
# Then open http://<host>:${FRONTEND_PORT:-8080}
#
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [pymanager]
    # UPDATE 1: Expose Mongo to the host so the backend can reach it
    ports:
      - "27017:27017" 

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    # UPDATE 2: Enable host networking and remove the 'networks' and 'ports' sections
    network_mode: "host" 
    depends_on:
      - mongo
    environment:
      # UPDATE 3: Point to localhost since backend is now on the host network
      MONGO_URL: "mongodb://127.0.0.1:27017" 
      DB_NAME: "pymanager"
      CORS_ORIGINS: "*"
      WORKSPACE_DIR: "/workspace"
      PYTHON_BIN: "/usr/local/bin/python3.12"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
    volumes:
      # user scripts + logs live on the host so they survive rebuilds
      - "${HOST_WORKSPACE:-./workspace}:/workspace"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [pymanager]
    # UPDATE 4: Allows the frontend container to reach the backend via the host IP
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo_data:

networks:
  pymanager:
    driver: bridge
